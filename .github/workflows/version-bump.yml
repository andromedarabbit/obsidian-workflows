name: Validate Version Bump

on:
  pull_request:
    paths:
      - 'hooks/**'
      - 'skills/**'
      - 'commands/**'
      - 'assets/**'
      - 'config/**'
      - '.claude-plugin/**'
  push:
    branches:
      - main
    paths:
      - 'hooks/**'
      - 'skills/**'
      - 'commands/**'
      - 'assets/**'
      - 'config/**'
      - '.claude-plugin/**'

jobs:
  version-bump:
    name: Version bump required when shipped files change
    runs-on: ubuntu-latest
    steps:
      - name: Checkout code
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Check version bump against push/PR base
        run: |
          base="${{ github.event.pull_request.base.sha }}"
          if [ -z "$base" ] || [ "$base" = "0000000000000000000000000000000000000000" ]; then
            base="${{ github.event.before }}"
          fi
          bash tools/check-version-bump.sh "$base"
